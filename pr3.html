<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="thankyou.html">
        <fieldset>
            <legend>
                <h1>Personal Information</h1>
            </legend>
            <label for="fname"><b>First Name:</b></label>
            <input type="text"id="fname" name="fname" required><br><br>
            <label for="lname"><b>Last Name:</b></label>
            <input type="text" id="lname" name="lname" required><br><br>
            <label for="gender"><b>Gender:</b></label>
            <input type="radio" id="male" name="gender" value="male" >Male
            <input type="radio" id="female" name="gender" value="female" >Female <br>
            <br>
            <label for="date"><b>Date of Birth:</b></label>
            <input type="date" id="date" name="date" required><br><br>
            <label for="file"><b>Uppload Your Photo</b></label>
            <input type="file" id="file" name="file" required><br><br>
        </fieldset>
        <fieldset>
        <legend>
            <h1>Contact Information</h1>
            </legend>
            <label for="email"><b>Email:</b></label>
            <input type="text" id="email" name="email" required><br><br>
            <label for="Mobile No "><b>Mobile Number:</b></label>
            <input type="text" id="Mobile No" name="Mobile No" required><br><br>
            <label for="address"><b>Address:</b></label>
            <input type="textbox" id="address" name="address" required><br><br>
            <label for="city"><b>City:</b></label>
            <input type="text" id="city" name="city" required><br><br>
            <label for="state"><b>State:</b></label>
            <input type="text" id="state" name="state" required><br><br>    
            <label for="pincode"><b>Pin Code:</b></label>
            <input type="pincode" id="pincode" name="pincode" required><br><br>
        </fieldset>
        <fieldset>
            <legend>            
            <h1>Academic Information</h1>
            </legend>
        <label for="id"><b>Student ID</b></label>
        <input type="text" name="id" id="id" required><br><br>
        <label for="pass"><b>Password</b></label>
        <input type="password" name="pass" id="pass" required><br><br>
        <label for="dept"><b>Department</b></label>
        <select name="dept" id="dept">
            <option value="cm">Computer Science</option>
            <option value="it">Information Technology</option>
            <option value="me">Mechanical Engineering</option>
        </select>
        <br><br>
        <label for="year"><b>Year</label>
            <select name="year" id="year">Select Year
            <option value="fy">FY</option>
            <option value="sy">SY</option>
            <option value="ty">TY</option>
        </select>
        <label for="pq"><b>Previous Qualification</b></label>
        <select name="pq" id="pq">select
            <option value="dip">Diploma</option>
            <option value="degree">BE</option>
        </select>
        </fieldset>
    </form>
    <center>
        <input type="submit" value="Submit">
    </center>


</body>
</html>
